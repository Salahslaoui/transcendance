http {
    include mime.types;


    server{
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/ssl/certs/sslcert.crt;
        ssl_certificate_key /etc/ssl/private/sslkey.key;

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ws {
            rewrite ^/api/ws/(.*)$ /ws/$1 break;
            proxy_pass http://backend:8000;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }
    }
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}

events {}


#TL;DR — lifecycle perspective
# Nginx Phase               What happens with upstream hostnames	                        Docker implication
# Startup / Master	        Static hostnames resolved immediately	                        Might fail if Docker DNS not ready
# Worker request handling	Handles requests; dynamic hostnames resolved at request time	Safe, resolves frontend live
# Reload / graceful restart	Config re-parsed	Can re-resolve static hostnames
